<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinLedger — Summary</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236d5efc'/%3E%3Cpath fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round' d='M9 3h6l1.5 3c2.485 1.007 4.5 3.24 4.5 6.75C21 17.75 17.142 21 12 21S3 17.75 3 12.75C3 9.24 5.015 7.007 7.5 6L9 3Z'/%3E%3Cpath fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round' d='M12 9v7.5M10 10.5c0-.9.9-1.5 2-1.5s2 .6 2 1.5-1 1.5-2 1.5-2 .6-2 1.5 1 1.5 2 1.5 2-.6 2-1.5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><div class="brand-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M9 3h6l1.5 3c2.485 1.007 4.5 3.24 4.5 6.75C21 17.75 17.142 21 12 21S3 17.75 3 12.75C3 9.24 5.015 7.007 7.5 6L9 3Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v7.5M10 10.5c0-.9.9-1.5 2-1.5s2 .6 2 1.5-1 1.5-2 1.5-2 .6-2 1.5 1 1.5 2 1.5 2-.6 2-1.5"/></svg></div><span>FinLedger</span></div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">v2.0.0 • © FinLedger</div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" id="hamburger" aria-label="Menu"></button>
          <div class="page-title" id="page-title">Summary</div>
        </div>
        <div class="topbar-right">
            <button class="topbar-btn" data-theme-toggle aria-label="Toggle theme"></button>
          <div class="user-chip" id="user-chip"><div class="avatar">?</div></div>
            <button class="topbar-btn" id="logout-btn" title="Logout" aria-label="Logout"></button>
        </div>
      </header>

      <main class="content">
        <div class="section-header">
          <h2>Summary</h2>
        </div>

        <div class="filter-bar">
          <div class="field">
            <label>Start date</label>
            <input type="date" class="input" id="s-start" />
          </div>
          <div class="field">
            <label>End date</label>
            <input type="date" class="input" id="s-end" />
          </div>
          <div class="filter-actions">
            <button class="btn btn-primary" id="s-apply">Apply</button>
            <button class="btn btn-ghost" id="s-reset">Reset</button>
          </div>
        </div>

        <div class="grid-kpi" id="s-kpis">
          <div class="skeleton skeleton-kpi"></div>
          <div class="skeleton skeleton-kpi"></div>
          <div class="skeleton skeleton-kpi"></div>
        </div>

        <div class="grid-2" style="grid-template-columns:1.6fr 1fr;">
          <div class="chart-card">
            <h3>Income &amp; Expense Trend</h3>
            <div class="chart-canvas-wrap">
              <canvas id="s-trend-chart"></canvas>
            </div>
          </div>
          <div class="chart-card">
            <h3>Income vs Expense Split</h3>
            <div class="radial-ratio-wrap" id="s-radial">
              <div class="skeleton skeleton-circle" style="width:148px;height:148px;"></div>
            </div>
          </div>
        </div>

        <div class="card no-hover" style="margin-bottom:24px;">
          <div class="card-title">Monthly Breakdown</div>
          <div class="table-wrap" style="border:none;box-shadow:none;">
            <table class="table">
              <thead>
                <tr><th>Month</th><th class="right">Income</th><th class="right">Expense</th><th class="right">Net</th><th class="right">Txns</th></tr>
              </thead>
              <tbody id="s-monthly"></tbody>
            </table>
          </div>
        </div>

        <div class="card no-hover">
          <div class="card-title">Category Breakdown</div>
          <div class="table-wrap" style="border:none;box-shadow:none;">
            <table class="table">
              <thead>
                <tr><th>Category</th><th class="right">Amount</th><th class="right">% of Total</th></tr>
              </thead>
              <tbody id="s-cat"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/icons.js"></script>
  <script src="/static/js/layout.js"></script>
  <script src="/static/js/summary.js"></script>
</body>
</html>
